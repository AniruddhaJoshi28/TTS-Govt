<!doctype html>
<html lang="mr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>शासन निर्णय सहाय्यक</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="emblem" aria-hidden="true">📜</span>
      <div>
        <div class="brand-name" data-i18n="appName"></div>
        <div class="brand-tag" data-i18n="tagline"></div>
      </div>
    </div>
    <div class="topbar-actions">
      <button type="button" id="btn-top-upload" class="btn upload-quick-btn" data-testid="btn-top-upload">
        <span aria-hidden="true">📤</span> <span data-i18n="uploadQuickBtn">नवीन GR अपलोड करा</span>
      </button>
      <label class="lang">
        <span data-i18n="language"></span>
        <select id="language" data-testid="language">
          <option value="mr">मराठी</option>
          <option value="hi">हिंदी</option>
          <option value="or">ଓଡ଼ିଆ</option>
          <option value="en">English</option>
        </select>
      </label>
    </div>
  </header>

  <nav class="states" role="tablist" aria-label="State">
    <button role="tab" data-state="MH" data-testid="state-MH">महाराष्ट्र</button>
    <button role="tab" data-state="MP" data-testid="state-MP">मध्य प्रदेश</button>
    <button role="tab" data-state="OD" data-testid="state-OD">ଓଡ଼ିଶା</button>
    <button role="tab" data-state="UP" data-testid="state-UP" class="upload-tab">📤 <span data-i18n="uploadTab">दस्तऐवज अपलोड</span></button>
  </nav>

  <main class="layout">
    <section class="col-main">
      <!-- Upload zone (visible when Upload tab is active) -->
      <section id="upload-section" class="card upload-card" style="display: none;" data-testid="upload-section">
        <h2 data-i18n="uploadTitle">Upload a Document</h2>
        <p class="upload-hint" data-i18n="uploadHint">Drop any PDF, DOCX, TXT, RTF, ODT, or image file here — or click to browse.</p>
        <div id="drop-zone" class="drop-zone" data-testid="drop-zone">
          <div class="drop-icon">📄</div>
          <p class="drop-text" data-i18n="dropText">Drag & drop your file here</p>
          <p class="drop-or">— or —</p>
          <label class="btn primary upload-btn">
            <span data-i18n="browseFiles">Browse Files</span>
            <input type="file" id="file-input" data-testid="file-input"
                   accept=".pdf,.docx,.doc,.txt,.rtf,.odt,.jpg,.jpeg,.png,.tif,.tiff,.bmp,.webp"
                   hidden>
          </label>
          <div class="format-badges">
            <span class="format-badge">PDF</span>
            <span class="format-badge">DOCX</span>
            <span class="format-badge">DOC</span>
            <span class="format-badge">TXT</span>
            <span class="format-badge">RTF</span>
            <span class="format-badge">ODT</span>
            <span class="format-badge">JPG</span>
            <span class="format-badge">PNG</span>
            <span class="format-badge">TIFF</span>
          </div>
          <p class="size-hint">Max 50 MB</p>
        </div>
        <div id="upload-progress" class="upload-progress" style="display: none;" data-testid="upload-progress">
          <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
          <p id="upload-status" class="upload-status"></p>
        </div>
        <div id="upload-result" data-testid="upload-result"></div>
      </section>

      <div id="doc-switcher" class="doc-selector-bar" style="display: none;" data-testid="doc-switcher"></div>
      <article id="doc-card" class="card doc-card" data-testid="doc-card" aria-live="polite"></article>

      <section class="card">
        <div class="card-head">
          <h2 data-i18n="summaryTitle"></h2>
          <button id="btn-summary" class="btn primary" data-testid="btn-summary" data-i18n="summaryButton"></button>
        </div>
        <div id="summary" data-testid="summary" aria-live="polite"></div>
      </section>

      <section class="card">
        <h2 data-i18n="askTitle"></h2>
        <form id="ask-form" class="ask" autocomplete="off">
          <textarea id="question" data-testid="question" rows="2" maxlength="500"></textarea>
          <div class="ask-actions">
            <button type="button" id="btn-mic" class="btn" data-testid="btn-mic">
              <span aria-hidden="true">🎙️</span> <span data-i18n="speak"></span>
            </button>
            <button type="submit" id="btn-ask" class="btn primary" data-testid="btn-ask" data-i18n="ask"></button>
          </div>
          <p id="mic-status" class="hint" aria-live="polite"></p>
        </form>
        <div id="answer" data-testid="answer" aria-live="polite"></div>
      </section>
    </section>

    <aside class="col-side card" id="source-panel" data-testid="source-panel" aria-live="polite">
      <h2 data-i18n="sourceTitle"></h2>
      <div id="source-body" class="source-body"><p class="muted" data-i18n="sourceHint"></p></div>
    </aside>
  </main>

  <footer class="footer" data-i18n="disclaimer"></footer>
  <script src="app.js"></script>
</body>
</html>
