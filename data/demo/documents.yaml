# Demo document set: one recent, citizen-facing official document per state.
#
# Selected on 2026-10-17 from each state's official portal. The PDFs are not
# committed; scripts/fetch_demo_documents.py downloads them into data/raw/.
# `portal_metadata` is copied verbatim from the official listing page and is
# used as a separate, citable source (it is typed text, not OCR).
#
# Selection notes:
# - Documents naming private individuals (e.g. ex-gratia beneficiary orders)
#   were skipped so no personal data appears in demo recordings (plan rule 7).
# - Reuse terms: MH robots.txt allows /; the MH disclaimer page returned no
#   content when fetched. Formal reuse review for all three sources is pending.

