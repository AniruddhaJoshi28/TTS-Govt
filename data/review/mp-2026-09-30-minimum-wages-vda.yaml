      अधिसूचना
      विषय – न्यूनतम वेतन अधिनियम, 1948 के अंतर्गत राज्य के श्रमिकों के लिए दिनांक 01.10.2026 से परिवर्तनशील मंहगाई भत्ते सहित पुनरीक्षित न्यूनतम वेतन की दरें।
      माह जनवरी से जून, 2026 की छःमाही का औसत सूचकांक 431 रहा है, अतः गत छःमाही में मान्य किये गये अखिल भारतीय उपभोक्ता मूल्य सूचकांक के औसत (425) के ऊपर (431-425) = 6 औसत बिन्दु की वृद्धि हुई है। फलस्वरूप दिनांक 01.10.2026 से 31.03.2027 तक जारी दरें निम्नानुसार रहेंगी।
      अनुसूची – अ (खण्ड – ब): 67 अनुसूचित नियोजन में मासिक एवं दैनिक वेतन की दरें जिसमें परिवर्तनशील मंहगाई भत्ता सम्मिलित है (26 दिन के मान से, आंकड़े रूपये में)।
