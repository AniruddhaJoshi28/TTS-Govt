          श्रमिकों को कौन-से दस्तावेज़ जमा करने होंगे? ऐसे में प्रणाली अंदाज़ा नहीं लगाती। वह साफ़
          बताती है, कि उपलब्ध दस्तावेज़ों से इस सवाल का उत्तर तय नहीं किया जा सकता।
