# Demo video scripts, one video per state (plan §9). Input to scripts/demo/make_demo_video.py.
#
# Each scene pairs narration with the on-screen action it describes. The recorder starts
# the narration and the action together and holds the scene until both have finished,
# so speech and picture stay in step.
#
# Actions: title_card, overview, document, summary, open_citation, ask, listen_answer,
#          closing_card.
#
# - Narration is AI speech (Indic Parler-TTS); a permanent on-screen label says so, and
#   the closing line says it aloud. The product's own answer voice is a different
#   speaker, so the two are distinguishable (plan §8).
# - Numbers are written as words so the voice reads them naturally.
# - Narration only describes what the screen shows. "ask" scenes declare the answer
#   status the narration assumes (`expect`); the recorder aborts if the real model
#   answer differs. "unknown" questions ask for something the document does not contain
#   (verified against the extracted text), so the correct behaviour is to decline.
# - All regional text is a DRAFT pending native-speaker review.

