      - id: overview
        action: overview
        narration: >-
          यह इसकी मुख्य स्क्रीन है। ऊपर तीन राज्य हैं, महाराष्ट्र, मध्य प्रदेश और ओडिशा। और दाईं ओर,
          आप अपनी पसंद की भाषा चुन सकते हैं।
      - id: document
        action: document
        narration: >-
          यह श्रमायुक्त कार्यालय, मध्यप्रदेश की, तीस सितंबर दो हज़ार छब्बीस की अधिसूचना है, जिसमें
          श्रमिकों के न्यूनतम वेतन की नई दरें दी गई हैं। यह सीधे सरकार के आधिकारिक पोर्टल से ली गई है।
          यह एक स्कैन किया हुआ दस्तावेज़ है, इसलिए प्रणाली ने इसे OCR से पढ़ा है। जिन अंकों को OCR साफ़
          नहीं पढ़ पाया, उन्हें अलग से चिह्नित किया गया है।
