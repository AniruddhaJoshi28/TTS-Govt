# Demo video scenes, one video per state (plan §9 structure).
# Canonical source for scripts/demo/make_demo_video.py.
#
# - Narration is spoken by an AI voice (Indic Parler-TTS). Every video carries a
#   permanent on-screen label saying so, and the closing line says it aloud.
# - The product's own answer audio uses a different speaker so the two voices are
#   distinguishable (plan §8).
# - Numbers in narration are written as words so the TTS reads them correctly.
# - Narration only describes what the screen shows. Facts about each document
#   were checked against the official PDF; the model's actual answers are what
#   appear on screen, and the pipeline aborts if an answer's status does not
#   match the narration (`expect`).
# - "unknown" scenes ask for something the document does not contain (a deadline, required
#   documents), so the correct behaviour is to decline rather than offer a related date.
# - All regional text is a DRAFT pending native-speaker review.

