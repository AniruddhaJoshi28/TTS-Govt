[project]
name = "government-gr-assistant"
version = "0.1.0"
description = "Government GR summariser and regional-language voice assistant (Maharashtra, Madhya Pradesh, Odisha)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "requests>=2.32",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
